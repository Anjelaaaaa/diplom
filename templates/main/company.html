<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аленка-Капитал</title>
    <script src="https://code.highcharts.com/stock/highstock.js"></script>
    <script src="https://code.highcharts.com/stock/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/stock/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <style>
        #container {
            height: 400px;
            min-width: 310px; /* Минимальная ширина для графика */
        }
        .tab {
            padding: 10px 20px;
            box-shadow: 0 0 13px rgba(102, 102, 102, 0.16);
            border-radius: 5px;
            margin-right: -4px;
            cursor: pointer;
            display: inline-block;
            background-color: #ffffff;
        }
        .active {
            background-color: #f5f5f5;
            box-shadow: 0 0 7px rgba(57, 62, 87, 0.16);
        }
    </style>
</head>
<body>
    <div>
        <div class="tab active" id="tab-pai">Пай</div>
        <div class="tab" id="tab-scha">СЧА</div>
    </div>
    <div>
        <label class="benchmark">
            <input type="checkbox" id="benchmark-toggle"> Сравнить с бенчмарком
        </label>
    </div>
    <div id="container"></div>

    <script>
        (async () => {
            // Используйте chartData из вашего шаблона
            var shareData = JSON.parse('{{ share_data | safe }}'); // Данные для пая
            var benchmarkData = JSON.parse('{{ benchmark_data | safe }}'); // Данные для бенчмарка
            var schaData = JSON.parse('{{ scha_data | safe }}'); // Данные для СЧА

            // Устанавливаем опции Highcharts для русского языка
            Highcharts.setOptions({
                lang: {
                    decimalPoint: ',',
                    thousandsSep: ' ',
                    months: [
                        'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                        'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
                    ],
                    weekdays: [
                        'Воскресенье', 'Понедельник', 'Вторник', 'Среда', 
                        'Четверг', 'Пятница', 'Суббота'
                    ],
                    shortMonths: [
                        'Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 
                        'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'
                    ],
                    rangeSelectorFrom: 'С',
                    rangeSelectorTo: 'По',
                    rangeSelectorZoom: 'Период',
                }
            });

            // Функция для создания графика
            function createChart(shareData, benchmarkData = null) {
                const benchmarkVisible = document.getElementById('benchmark-toggle').checked;

                // Создаем график
                const chart = Highcharts.stockChart('container', {
                    rangeSelector: {
                        selected: 1,
                        buttons: [
                            { type: 'month', count: 1, text: '1м' },
                            { type: 'month', count: 3, text: '3м' },
                            { type: 'month', count: 6, text: '6м' },
                            { type: 'month', count: 12, text: '1г' },
                            { type: 'month', count: 36, text: '3г' },
                            { type: 'all', text: 'Все' }
                        ]
                    },
                    series: [{
                        name: 'Стоимость пая',
                        data: shareData,
                        type: 'spline',
                        color: '#000f9f',
                        tooltip: {
                            valueDecimals: 2,
                            pointFormat: '<span style="color:{point.color}">{series.name}: <b>{point.y}</b> руб.</span><br/>',
                        }
                    }]
                });

                // Если чекбокс для бенчмарка включен, добавляем его к графику
                if (benchmarkVisible) {
                    chart.addSeries({
                        name: 'Бенчмарк',
                        data: benchmarkData,
                        type: 'spline',
                        color: '#152188',
                        tooltip: {
                            valueDecimals: 2,
                            pointFormat: '<span style="color:{point.color}">{series.name}: <b>{point.y}</b> руб.</span><br/>',
                        }
                    });
                }
            }

            // Инициализируем график на вкладке "Пай"
            createChart(shareData, benchmarkData);

            // Обработчики для вкладок
            document.getElementById('tab-pai').addEventListener('click', () => {
                createChart(shareData, benchmarkData); // График пая
                setActiveTab('tab-pai');
            });

            document.getElementById('tab-scha').addEventListener('click', () => {
                createChart(schaData); // График СЧА (без бенчмарка)
                setActiveTab('tab-scha');
            });

            // Функция для установки активной вкладки
            function setActiveTab(activeTabId) {
                // Удаляем классы active со всех вкладок
                document.querySelectorAll('.tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                // Устанавливаем active класс для текущей вкладки
                document.getElementById(activeTabId).classList.add('active');
            }

            // Обработчик для чекбокса бенчмарка
            document.getElementById('benchmark-toggle').addEventListener('change', () => {
                // Обновляем график при изменении состояния чекбокса
                if(document.querySelector('.active').id === 'tab-pai') {
                    createChart(shareData, benchmarkData); // Обновляем график пая
                }
            });
        })();
    </script>
</body>
</html>
